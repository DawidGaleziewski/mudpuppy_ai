[project]
name = "pathfinder-dashboard"
version = "0.1.0"
description = "Read-only operator dashboard over Pathfinder's crawl store (FastAPI + htmx)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pathfinder-dashboard = "pathfinder_dashboard.__main__:main"
pathfinder-dashboard-smoke = "pathfinder_dashboard.smoke:main"
pathfinder-glossary = "pathfinder_dashboard.glossary_cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "perf: wall-clock budget tests; run serially: `pytest -n auto -m 'not perf'` then `pytest -m perf`",
]

# On-demand mutation testing of the pure modules (G-32); writes to ./mutants/
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/pathfinder_dashboard/diagrams.py",
    "src/pathfinder_dashboard/glossary.py",
    "src/pathfinder_dashboard/visuals.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_diagrams.py",
    "tests/test_glossary.py",
    "tests/test_glossary_edges.py",
    "tests/test_visuals.py",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The UI uses typographic dashes and ellipses on purpose ("1–50 of 600", "…").
allowed-confusables = ["–", "…"]

# Thresholds of the on-demand complexity report (G-03, G-04; not in `select`):
# uv run ruff check --select C901,PLR0912,PLR0913,PLR0915 --exit-zero
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 5

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]
