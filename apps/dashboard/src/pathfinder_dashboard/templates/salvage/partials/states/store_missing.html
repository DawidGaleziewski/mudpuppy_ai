<section class="sy-state sy-state--failure" role="alert">
  <h2 class="sy-state__title">No store “{{ env }}”</h2>
  <p>Expected a SQLite file at <span class="sy-mono sy-mono--sm mp-break">{{ path }}</span>. Run a scan for it, or pick another data store in the nav.</p>
  <p><a class="sy-btn sy-btn--sm" href="{{ c.url(request.url.path) }}">Retry</a></p>
</section>
