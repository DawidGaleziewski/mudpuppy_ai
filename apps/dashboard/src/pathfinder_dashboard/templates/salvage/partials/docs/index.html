{% import "salvage/macros.html" as sy %}
{% call sy.region("docs-index", index.self_url, "Documentation sections") %}
  <nav class="sy-plate" aria-label="Documentation sections">
    <div class="sy-rows">
      {%- for sid, label, count, url in index["items"] %}
      <a class="sy-row mp-row-link" href="{{ url }}"{% if sid == index.current %} aria-current="true"{% endif %}>
        <span class="sy-split"><span>{{ label }}</span> <span class="sy-count sy-count--muted">{{ count }}</span></span>
      </a>
      {%- endfor %}
    </div>
  </nav>
{% endcall %}
