# Ground truth: scar-maker (apps/scar-maker, spec 030), the portal of real-world scars.
# Written by Claude from the scar modules (the portal is ours, like the dashboard self-eval),
# for the screens a read-only guest map reaches from / on portals/scar-maker as configured (no
# fixes on). Left out on purpose: screens that depend on chance or on a visit order (SC-07's
# one-time promo and covered Downloads), on a fix-plugin (SC-08's services, SC-09's products), on a
# submit a read-only guest may not do (SC-04 result, SC-18 later steps), or that end a run by design
# (SC-02's 403 page, SC-13's allowlist). Locale: en (some scars are German on purpose).
# Schema: GroundTruth in apps/crawler/packages/reference-portal/src/ground-truth.ts.

