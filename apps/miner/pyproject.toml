[project]
name = "pathfinder-miner"
version = "0.1.0"
description = "MudPuppy 2.0 analysis worker (spec 039 R-81): decision mining and community detection over a read-only store; output is JSON written to the store only by `pnpm model:import`."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scikit-learn>=1.3",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.scripts]
pathfinder-miner = "pathfinder_miner.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "…"]
