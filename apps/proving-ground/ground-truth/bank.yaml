forms:
  - id: F01
    screen: S02
    label: Logowanie do bankowości
    method: post
    fields:
      - id: F01.1
        label: Login
        type: text
        constraints:
          required: true
      - id: F01.2
        label: Hasło
        type: password
        constraints:
          required: true
  - id: F02
    screen: S04
    label: Przelew krajowy
    method: post
    fields:
      - id: F02.1
        label: Numer rachunku
        type: text
        constraints:
          required: true
          pattern: PL\d{26}
      - id: F02.2
        label: Kwota
        type: text
        constraints:
          required: true
          min: 0,01
          max: 20 000,00
      - id: F02.3
        label: Tytuł przelewu
        type: text
        constraints:
          required: true
          max_length: 140
rules:
  - id: R01
    statement: "The recipient account number must be a Polish IBAN: PL followed by 26 digits, with a
      valid mod-97 checksum."
    type: format
    anchor:
      screen: S04
      label: Numer rachunku
    guest_observable: false
    claim_markers:
      - Nieprawidłowy numer rachunku
      - checksum
      - suma kontrolna
      - 26 cyfr
      - 26 digits
      - mod 97
  - id: R02
    statement: The transfer amount must be between 0,01 zł and 20 000,00 zł.
    type: range
    anchor:
      screen: S04
      label: Kwota
    guest_observable: false
    claim_markers:
      - 0,01
      - 20 000,00 zł
      - 20 000 zł
  - id: R03
    statement: The amount is entered with a decimal comma (for example 1 234,50); a decimal point is rejected.
    type: format
    anchor:
      screen: S04
      label: Kwota
    guest_observable: false
    claim_markers:
      - decimal comma
      - przecinek
      - przecinkiem
      - 1 234,50
  - id: R04
    statement: The transfer title must have 1 to 140 characters.
    type: range
    anchor:
      screen: S04
      label: Tytuł przelewu
    guest_observable: false
    claim_markers:
      - 140 znak
      - 140 char
      - 1–140
      - 1 do 140
  - id: R05
    statement: The total of transfers made in one day cannot exceed the daily limit of 20 000,00 zł.
    type: validation
    anchor:
      screen: S04
      label: Kwota
    guest_observable: false
    claim_markers:
      - dzienny limit
      - daily limit
      - Przekroczono dzienny limit
  - id: R06
    statement: A transfer cannot exceed the balance of the source account.
    type: validation
    anchor:
      screen: S04
      label: Kwota
    guest_observable: false
    claim_markers:
      - Niewystarczające środki
      - insufficient funds
      - insufficient balance
  - id: R07
    statement: A transfer submitted after 22:00 (estate clock) is booked on the next working day;
      weekends are skipped.
    type: computation
    anchor:
      screen: S05
      label: Data księgowania
    guest_observable: false
    claim_markers:
      - 22:00
      - next working day
      - następny dzień roboczy
      - kolejny dzień roboczy
processes:
  - id: P01
    name: Wykonaj przelew krajowy
    steps:
      - /bank/pulpit
      - /bank/przelew
      - /bank/przelew/potwierdzenie
    first_route: /bank/pulpit
    last_observable_route: /bank/przelew
    ends_with: mutation
  - id: P02
    name: Obejrzyj wyciąg miesięczny
    steps:
      - /bank/pulpit
      - /bank/wyciagi
    first_route: /bank/pulpit
    last_observable_route: /bank/wyciagi
    ends_with: result
  - id: P03
    name: Obejrzyj historię operacji
    steps:
      - /bank/historia
      - /legacy/bank/historia.do
      - /legacy/bank/lista.do
    first_route: /bank/historia
    last_observable_route: /legacy/bank/lista.do
    ends_with: result
  - id: P04
    name: Zaloguj się do bankowości
    steps:
      - /bank
      - /logowanie
    first_route: /bank
    last_observable_route: /logowanie
    ends_with: login_wall
