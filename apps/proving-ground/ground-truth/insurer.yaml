      label: Miejsce zdarzenia
    guest_observable: false
    claim_markers:
      - Podaj miejsce zdarzenia
      - place of the event is required
  - id: R07
    statement: The claim steps are kept on the server and must be completed in order; going Back in the
      browser resets the wizard to step 1.
    type: ui_enablement
    anchor:
      screen: S06
      label: Nie używaj przycisku Wstecz przeglądarki.
    guest_observable: false
    claim_markers:
      - Nie używaj przycisku Wstecz
      - Back button
      - resets the wizard
      - step 1
  - id: R08
