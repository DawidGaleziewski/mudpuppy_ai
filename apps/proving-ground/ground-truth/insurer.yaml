rules:
  - id: R01
    statement: A claim must be reported within 30 days of the event, and the event date cannot be in the
      future.
    type: validation
    anchor:
      screen: S06
      label: Data zdarzenia
    guest_observable: true
    claim_markers:
      - 30 dni
      - 30 days
  - id: R02
    statement: The Assistance Premium add-on is available only for policies with a sum insured of 50 000
      zł or more.
    type: eligibility
    anchor:
      screen: S05
      label: Assistance Premium
    guest_observable: false
    claim_markers:
      - 50 000 zł
      - 50 000
      - "50000"
  - id: R03
    statement: The add-on start date cannot be earlier than today (the estate date).
    type: validation
    anchor:
      screen: S05
      label: Data rozpoczęcia
    guest_observable: false
    claim_markers:
      - wcześniejsza niż dziś
