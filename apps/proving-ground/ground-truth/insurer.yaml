      label: Data rozpoczęcia
    guest_observable: false
    claim_markers:
      - późniejsza niż koniec polisy
      - after the end of the policy
      - policy end
  - id: R05
    statement: The event description is required to continue the claim.
    type: validation
    anchor:
      screen: S06
      label: Opis zdarzenia
    guest_observable: false
    claim_markers:
      - Opisz zdarzenie
