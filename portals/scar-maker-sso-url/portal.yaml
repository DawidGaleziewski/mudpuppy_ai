# Scar-maker SC-16 with a URL-only success sign (spec 037 FR-005): "logged in" = no longer on the
# portal's login page. Mid-chain the identity provider's pages already "do not match" it, so the
# check must wait until the browser leaves the provider's host (the learned transit zone).
id: scar-maker-sso-url
base_url: http://127.0.0.1:4300/
environment: sandbox
max_action_class: read

compliance:
  robots_checked_on: 2026-10-18
  terms_reviewed_on: 2026-10-18
  terms_reviewed_by: local test estate, no terms

scope:
  allowed_domains: ["127.0.0.1", "127.0.0.2"]
  external_link_policy: record
  max_depth: 6
  max_states: 40
  max_actions_per_state: 40
  max_run_time_minutes: 20
  max_steps: 200

urls:
  disallowed:
    - /__admin/*

denylist: []

rate_limit:
  requests_per_second: 5
  max_concurrency: 2
  user_agent: "PathfinderAI-Crawler/0.1 (local scar-maker)"

login:
  url: "/sc16/login"
  username: { label: "User name" }
  password: { label: "Password" }
  submit: { role: button, name: "Continue" }
  success: { url_not_matching: "/sc16/login" }
  failure: { text: ["The sign-in failed."] }
  fields: { username: login, password: password }
