# Added from the dashboard (spec 011) on 2026-10-06.
# Tightened 2026-10-10 (R-46) for the learning eval task `wikipedia` (apps/crawler/evals/tasks.ts):
# live production site, so read-only, two hosts only, small budgets, a slow rate.
id: wikipedia
# Owner sign-off before any live run (no longer enforced by preflight since constitution 4.0.0;
# kept as our own gate). Signed 2026-10-10 by the owner for the R-46 learning trial; robots.txt of
# both hosts read that day (en.wikipedia.org disallows /w/, /api/ and /wiki/Special:).
compliance:
  robots_checked_on: 2026-10-10
  terms_reviewed_on: 2026-10-10
  terms_reviewed_by: DG
# robots.txt is obeyed (the default). Note: en.wikipedia.org disallows /wiki/Special:, and the home
# page search goes through /wiki/Special:Search, so a trace of "search for pickle" stops there
# unless the owner decides otherwise.
robots: respect
scope:
  allowed_domains:
    - www.wikipedia.org # the language portal with the search box
    - en.wikipedia.org # where the search lands
  external_link_policy: record
  max_depth: 3
  max_states: 20
  max_actions_per_state: 40
  max_run_time_minutes: 15
  max_steps: 60
urls:
  disallowed:
    - /wiki/Special:UserLogin*
    - /wiki/Special:CreateAccount*
    - /w/* # edit, history and raw views (also disallowed by robots)
denylist:
  - logout
rate_limit:
  requests_per_second: 1
  max_concurrency: 1
  user_agent: PathfinderAI-Crawler/0.1 (read-only learning eval, one trace at a time)
environments:
  production:
    base_url: https://www.wikipedia.org/
    max_action_class: read # was external-side-effect: guests can edit Wikipedia, so only look
    allowed_domains:
      - www.wikipedia.org
      - en.wikipedia.org
