  - id: screen
    term: Screen (SCR)
    category: ba
    group: Record kinds
    short: One page or view of the portal as the BA documents it, with its purpose, route templates, elements and how you reach it.
    explanation: |
      A screen usually corresponds to one cluster of states. It lists the elements by role and
      verbatim label, so it doubles as a description a developer could rebuild the page from.
    example: SCR-001 "Home page with global header and footer".
    appears_in: [Docs tab → Screens]
    labels: [Screen, SCR]
    related: [cluster, state, data-item]
    changed_in: R-22
    changed_on: 2026-10-03

  - id: process-record
    wiki: process-modelling-as-is
    term: Process (PROC)
    category: ba
    group: Record kinds
    short: A business process as the BA documents it, with its goal, persona, trigger, steps and outcome, based on trace runs.
    explanation: |
      The documented counterpart of a traced process. It also records how far the evidence goes
      (`observed_extent`), for example "up to the submit boundary", so nobody assumes the end of the
      process was seen.
    example: PROC-001 "Calculate an OC/AC premium".
    appears_in: [Docs tab → Processes]
    labels: [Process, PROC]
