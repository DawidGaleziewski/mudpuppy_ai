    changed_on: 2026-10-03

  - id: acceptance-criteria
    wiki: acceptance-criteria
    term: Acceptance criteria
    category: ba
    group: Record kinds
    short: The concrete conditions that show a requirement is met, written as Given, When, Then.
    explanation: |
      Each criterion is a small scenario: given a starting situation, when the user does something,
      then the system responds in a stated way. They are what QA turns into tests.
    appears_in: [Requirement page → Acceptance criteria]
    labels: [Acceptance criteria]
    related: [requirement, use-case]
    changed_in: R-22
    changed_on: 2026-10-03

  - id: business-rule
    wiki: business-rule
    term: Business rule (BR)
    category: ba
    group: Record kinds
    short: A rule the business imposes regardless of screen layout, such as which fields are required or which values are allowed.
    explanation: |
      Rules are written once and linked to every requirement, data item and screen they affect
      (`enforces`, `appears_on`). Complex rules use a decision table.
    example: 'BR-012 "Contact form: required fields, lengths and formats".'
    appears_in: [Docs tab → Business rules]
    labels: [Business rule, BR, Rule]
    related: [decision-table, rule-candidate, data-item]
