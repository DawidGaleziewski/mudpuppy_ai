    changed_on: 2026-10-03

  - id: decision-table
    wiki: decision-table
    term: Decision table
    category: ba
    group: Record kinds
    short: A table listing combinations of conditions and the outcome for each, used for rules with several inputs.
    explanation: |
      In a business rule, the "if" columns are conditions and the "then" columns are results; each
      row is one combination. It makes missing or contradictory cases easy to spot.
    appears_in: [Business rule page → if / then columns]
    labels: [if, then]
    related: [business-rule]
    changed_in: R-22
    changed_on: 2026-10-03

  - id: data-item
    wiki: data-dictionary
    term: Data item (DI)
    category: ba
    group: Record kinds
    short: One piece of data the portal handles, such as a phone number field, with its verbatim label, type, format and observed constraints.
    explanation: |
      Data items form the data dictionary. The label is kept exactly as the portal shows it, and
      the constraints are those observed (required, pattern, length, options). `seen_in` says where
      it appears.
    example: DI-015 "Telefon".
    appears_in: [Docs tab → Data items]
    labels: [Data item, DI]
