    changed_on: 2026-10-03

  - id: traceability
    wiki: traceability
    term: Traceability
    category: ba
    group: Statements and traceability
    short: Being able to follow a requirement back to where it came from and forward to what depends on or tests it.
    explanation: |
      In Pathfinder, backward traceability is built in: every record cites evidence and the
      evidence names its run. Forward traceability runs through relations (rule → requirement →
      use case) and, later, through test tags such as `@REQ-007`. The SRS export includes a
      traceability matrix.
    appears_in: [Record page, SRS export]
    labels: [Traceability]
    related: [evidence-link, relations, srs, traceability-matrix]
