  - id: glossary-term
    wiki: glossary
    term: Glossary term (GL)
    category: ba
    group: Record kinds
    short: A business word the documented portal uses, kept verbatim with its meaning, such as "OC".
    explanation: |
      These are the portal's terms, written by the BA agent. They are a different thing from this
      glossary, which explains Pathfinder's own words.
    example: GL-001 "OC".
