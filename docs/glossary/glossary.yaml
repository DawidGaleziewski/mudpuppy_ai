    changed_on: 2026-10-03

  - id: nfr
    wiki: non-functional-requirement
    term: Non-functional requirement (NFR)
    category: ba
    group: Record kinds
    short: A quality the system must have rather than a function it performs, such as speed, accessibility or reliable navigation.
    explanation: |
      Pathfinder writes NFRs only for what it actually measured (status codes, console errors,
      labels, robots policy). Qualities it could not measure go to the gaps instead.
    example: NFR-004 "No broken internal navigation for a guest".
    appears_in: [Docs tab → NFRs]
    labels: [NFR]
    related: [requirement, gaps]
