  - id: use-case
    wiki: use-case
    term: Use case (UC)
    category: ba
    group: Record kinds
    short: One actor's goal told as a flow, with a main path and the alternative and exception paths, written in Cockburn style.
    explanation: |
      Use cases turn a process into something a team can build and test against: who wants what,
      the steps that work, and every way it can go differently.
    example: UC-001 "Guest calculates an OC/AC premium".
    appears_in: [Docs tab → Use cases]
    labels: [Use case, UC]
    related: [process-record, requirement, acceptance-criteria]
    changed_in: R-22
    changed_on: 2026-10-03

  - id: requirement
    wiki: requirement
    term: Requirement (REQ)
    category: ba
    group: Record kinds
    short: A statement of what the system must do, written so that it can be tested.
    explanation: |
      Requirements describe behaviour the rebuilt system must keep. Each has acceptance criteria
      and cites the evidence it was derived from. They become `confirmed` only through a person's
      review.
    example: REQ-001 "Global menu and footer on every page".
    appears_in: [Docs tab → Requirements]
    labels: [Requirement, REQ]
    related: [nfr, acceptance-criteria, business-rule]
