  # ---- BA: record kinds ---------------------------------------------------------------------------
  - id: capability
    wiki: business-capability
    term: Capability (CAP)
    category: ba
    group: Record kinds
    short: Something the business offers its users at a high level, such as quoting car insurance, grouping the screens and processes that deliver it.
    explanation: |
      Capabilities give the big picture before the details. The BA writes them in pass 2 and links
      them to screens and processes with `contains`.
    example: CAP-001 "Product information and help content".
    appears_in: [Docs tab → Capabilities]
    labels: [Capability, CAP]
    related: [screen, process-record]
