  - id: evidence-link
    wiki: traceability
    term: Evidence link / cites
    category: ba
    group: Statements and traceability
    short: The link from a record to the recorded data that supports it, and a record without at least one is not allowed.
    explanation: |
      Each revision cites its evidence: a target plus a note on what it supports. The "Cites"
      column counts them and the record page lists them, so any statement can be checked against
      what the crawler actually recorded.
    appears_in: [Records → Cites, Record page → Evidence]
    labels: [Cites, Evidence, What it supports]
