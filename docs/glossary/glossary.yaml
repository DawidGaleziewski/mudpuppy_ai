    changed_on: 2026-10-14

  - id: proposal
    term: Proposal (assistant proposal)
    category: pathfinder
    group: Chat and workflow
    short: A change the assistant suggests in the chat, such as a new amendment or an edited step, which changes nothing until you press Apply.
    explanation: |
      A proposal shows what would change. Apply makes it a new revision under your name, the same
      way a hand edit does, and shows Undo; Undo restores the earlier content as yet another
      revision. Discard drops it. A proposal you leave alone waits in the review inbox, and one
      whose target changed meanwhile shows "Out of date".
    appears_in: [Assistant drawer, Review → Assistant proposals]
    labels: [Proposed, Apply, Undo, Discard, Out of date]
    related: [review-inbox, amendment, process-draft, chat]
