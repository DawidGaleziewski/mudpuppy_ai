  - id: model-element-key
    term: Element key of the model
    category: pathfinder
    group: Portal model
    short: The name that matches one element across scans, its role, masked name, the containers it sits in and its position when it repeats, such as button|oblicz składkę|main>form "Dane pojazdu"|.
    explanation: |
      Not the element key of a screen region (`role "name"#n`), which names elements of one
      recorded page. The model's key ignores numbers in names and adds the container path, so the
      same button is the same action in every scan; a moved link gets a new key and the model says
      which one it replaces.
