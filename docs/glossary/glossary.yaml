  # ---- BA: statements and traceability ------------------------------------------------------------
  - id: confidence
    term: Confidence (observed / inferred / needs confirmation)
    category: ba
    group: Statements and traceability
    short: How sure a statement is, either observed in the evidence, inferred as a reasonable deduction, or needing confirmation from someone who knows the business.
    explanation: |
      - `observed`: seen in the UI, network traffic or data.
      - `inferred`: deduced from what was seen, but not directly visible.
      - `needs_confirmation`: about intent or the reason behind behaviour, which only a person can
        confirm.

      The app shows what it does, never why. Keeping the three apart is the main protection against
      documentation that reads as fact but is a guess.
    appears_in: [Confidence column on states, actions and records]
    labels: [Confidence, observed, inferred, needs_confirmation]
    related: [documentation-record, evidence-link, assumption]
